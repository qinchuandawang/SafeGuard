# 视频换脸检测模块 - 项目配置

# 数据集配置
DATA:
  dataset_name: Celeb-DF-v2
  data_dir: data
  train_dir: data/train
  val_dir: data/val
  test_dir: data/test
  image_size: [299, 299]

# 模型配置
MODEL:
  name: Xception
  num_classes: 2
  pretrained: true
  input_size: 299

# 训练配置
TRAIN:
  batch_size: 32
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.00001
  num_workers: 4
  save_dir: checkpoints

# 数据增强
AUGMENTATION:
  random_crop: true
  random_flip: true
  color_jitter: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2

# API 配置
API:
  host: 0.0.0.0
  port: 5002
  debug: true
  max_video_frames: 24

# 设备配置
DEVICE:
  cuda: true
  gpu_id: 0
