# SafeGuard 一键部署配置
# ============================================
# 用法：
#   docker compose up -d                         # 核心服务（MySQL + Qdrant + Redis + RocketMQ + 后端）
#   docker compose --profile ai up -d            # 核心 + AI 检测服务
#   docker compose --profile web up -d           # 核心 + 管理后台 SPA
#   docker compose --profile observability up -d # 核心 + Zipkin 深度链路排障
#   docker compose --profile ai --profile web up -d  # 全部服务
# ============================================
#
# 环境变量文件：创建 .env 文件，填入对应 API Key
#   LLM_API_KEY=your_key         # AI 对话功能必需（SophNet DeepSeek-V4-Flash）
#   SILICONFLOW_API_KEY=your_key # RAG 向量检索必需
#   WECHAT_APPID=your_appid      # 微信小程序登录必需
#   WECHAT_SECRET=your_secret    # 微信小程序登录必需

services:
  # ==========================================
  # 核心服务（默认启动，不依赖特殊硬件）
  # ==========================================

  # MySQL 8.0 数据库
  db:
    image: mysql:8.0
    container_name: safeguard-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: safeguard
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${DB_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Qdrant 向量数据库（RAG 知识检索）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: safeguard-qdrant
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant-config:/qdrant/config
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis：任务状态快照、热点缓存、分布式扩展支撑
  redis:
    image: redis:7-alpine
    container_name: safeguard-redis
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO：原始音视频对象存储，数据库仅保存对象 Key
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: safeguard-minio
    restart: unless-stopped
    mem_limit: 256m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-safeguard}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-safeguard123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Sentinel Dashboard：流控、熔断规则和实时资源监控的主要治理入口
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: safeguard-sentinel-dashboard
    restart: unless-stopped
    mem_limit: 256m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx128m -Dserver.port=8858"
    ports:
      - "8858:8858"

  # Zipkin：可选的跨服务链路排障工具，不作为主治理控制台
  zipkin:
    profiles: ["observability"]
    image: openzipkin/zipkin:3
    container_name: safeguard-zipkin
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "9411:9411"

  # RocketMQ NameServer：消息路由元数据
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: safeguard-rocketmq-namesrv
    restart: unless-stopped
    mem_limit: 256m
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m"
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # RocketMQ Broker：检测任务事件总线
  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: safeguard-rocketmq-broker
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/conf/broker.conf"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin brokerStatus -n rocketmq-namesrv:9876 -b localhost:10911 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Spring Boot 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeguard-backend
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/safeguard?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEMORY_SHORT_TERM_CONTEXT_SIZE: ${MEMORY_SHORT_TERM_CONTEXT_SIZE:-20}
      MEMORY_SHORT_TERM_TTL_HOURS: ${MEMORY_SHORT_TERM_TTL_HOURS:-24}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-safeguard}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-safeguard123}
      MINIO_BUCKET: ${MINIO_BUCKET:-safeguard-media}
      ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-true}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      SENTINEL_ENABLED: ${SENTINEL_ENABLED:-true}
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      SENTINEL_API_PORT: 8719
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      ADMIN_BOOTSTRAP_REGISTER: ${ADMIN_BOOTSTRAP_REGISTER:-false}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
      VIDEO_PREPROCESS_ENABLED: ${VIDEO_PREPROCESS_ENABLED:-false}
      AUDIO_SERVICE_URL: ${AUDIO_SERVICE_URL:-http://safeguard-orchestrator:5003/v1/workflows/audio}
      VIDEO_SERVICE_URL: ${VIDEO_SERVICE_URL:-http://safeguard-orchestrator:5003/v1/workflows/video}
      ORCHESTRATOR_INTERNAL_TOKEN: ${ORCHESTRATOR_INTERNAL_TOKEN:-}
      ORCHESTRATOR_BASE_URL: http://safeguard-orchestrator:5003
      ORCHESTRATOR_MULTIMODAL_URL: http://safeguard-orchestrator:5003/v1/workflows/multimodal
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/app/data

  # ==========================================
  # AI 检测服务（--profile ai，需更多内存/可选 GPU）
  # ==========================================

  # 音频检测服务 (Flask + Wav2Vec2)
  audio-detection:
    profiles: ["ai"]
    build:
      context: ./ai-services/audio
      dockerfile: Dockerfile
    container_name: safeguard-audio
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "5000:5000"
    volumes:
      - ./ai-services/audio/pretrained:/app/pretrained
      - audio_data:/app/data
    environment:
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - AUDIO_MODEL_WAV2VEC2_ASVSPOOF=pretrained/asvspoof-finetuned
      - AUDIO_MODEL_WAV2VEC2_BASE=pretrained/wav2vec2-base
      - AUDIO_MODEL_AASIST=pretrained/aasist-asvspoof

  # 视频检测服务 (Flask + XceptionNet)
  video-detection:
    profiles: ["ai"]
    build:
      context: ./ai-services/video
      dockerfile: Dockerfile
    container_name: safeguard-video
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "5002:5002"
    volumes:
      - ./ai-services/video/pretrained:/app/pretrained
      - video_data:/app/data
    environment:
      - VIDEO_MODEL_XCEPTION_FFPP=pretrained/best_model.pth
      - VIDEO_MODEL_EFFICIENTNET_DFDC=pretrained/efficientnet_dfdc.pth
      - VIDEO_MODEL_MESONET_FFPP=pretrained/mesonet_ffpp.pth

  # LangGraph 仅编排 AI 推理节点；Java 后端仍维护业务任务状态。
  ai-orchestrator:
    profiles: ["ai"]
    build:
      context: ./ai-services/orchestrator
      dockerfile: Dockerfile
    container_name: safeguard-orchestrator
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - audio-detection
      - video-detection
    ports:
      - "5003:5003"
    volumes:
      - orchestrator_data:/app/data
    environment:
      AUDIO_DETECTION_URL: http://safeguard-audio:5000/audio/detect
      VIDEO_DETECTION_URL: http://safeguard-video:5002/api/detect/video
      TEXT_DETECTION_URL: http://backend:8080/api/internal/llm/text-detection
      ORCHESTRATOR_INTERNAL_TOKEN: ${ORCHESTRATOR_INTERNAL_TOKEN:-}
      ORCHESTRATOR_STORAGE_DIR: /app/data
      ORCHESTRATOR_MAX_CONCURRENT: ${ORCHESTRATOR_MAX_CONCURRENT:-4}
      AUDIO_FALLBACK_MODEL: ${AUDIO_FALLBACK_MODEL:-}
      VIDEO_FALLBACK_MODEL: ${VIDEO_FALLBACK_MODEL:-}
      TEXT_FUSION_WEIGHT: ${TEXT_FUSION_WEIGHT:-0.25}
      AUDIO_FUSION_WEIGHT: ${AUDIO_FUSION_WEIGHT:-0.35}
      VIDEO_FUSION_WEIGHT: ${VIDEO_FUSION_WEIGHT:-0.40}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # Web 管理后台（--profile web）
  # ==========================================

  # 管理后台前端 (Vue.js SPA，独立静态服务器)
  admin-panel:
    profiles: ["web"]
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: safeguard-admin
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "8085:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_data:
  audio_data:
  video_data:
  orchestrator_data:
  qdrant_data:
  redis_data:
  minio_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_broker_store:
