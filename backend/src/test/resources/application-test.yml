spring:
  ai:
    openai:
      api-key: test_key
      base-url: https://api.sophnet.com
      chat:
        options:
          model: DeepSeek-V4-Flash
    model:
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/test-schema.sql
      data-locations:
      encoding: UTF-8

mybatis-plus:
  type-aliases-package: com.sdu.safeguard.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: test-jwt-secret-key-for-unit-tests-only
  expiration-hours: 72

wechat:
  appid: ""
  secret: ""
  login-url: https://api.weixin.qq.com/sns/jscode2session

llm:
  api-key: test_key
  api-url: https://api.sophnet.com/v1/chat/completions
  model: DeepSeek-V4-Flash
  temperature: 0.7
  max-tokens: 256

siliconflow:
  api-key: ""
  embedding-url: http://localhost:9999/v1/embeddings
  rerank-url: http://localhost:9999/v1/rerank
  embedding-model: test-model
  rerank-model: test-model

rag:
  embedding-dimension: 768
  qdrant-host: localhost
  qdrant-port: 6333
  collection-name: test_knowledge
  fixed-chunk-size: 256
  fixed-chunk-overlap: 32
  hnsw-top-k: 5
  final-top-k: 3
  allow-in-memory-fallback: true

memory:
  short-term-max-size: 50
  long-term-max-size: 100
  long-term-ttl-hours: 168
  long-term-importance-threshold: 0.6
  storage-path: ./target/test-memory
  memory-retrieval-top-k: 5

audio:
  service:
    url: http://localhost:9999/audio/detect
  detection:
    api-url: http://localhost:9999/audio/detect
    health-url: http://localhost:9999/health

video:
  service:
    url: http://localhost:9999/video
    image-url: http://localhost:9999/video
  preprocess:
    enabled: false

server:
  port: 0

infra:
  redis:
    enabled: false
  sentinel:
    enabled: false
  rocketmq:
    enabled: false

task:
  recovery:
    enabled: false
  inference-capacity:
    wait-time-ms: 0
    models:
      wav2vec2-asvspoof:
        category: audio
        permits: 2
        lease-ms: 60000
      xception-ffpp:
        category: video
        permits: 1
        lease-ms: 300000
