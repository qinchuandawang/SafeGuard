<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SafeGuard 管理后台 - 检测记录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header"><h2>SafeGuard</h2><span class="version">v2.0</span></div>
            <ul class="nav-list">
                <li><a href="/admin/dashboard">概览</a></li>
                <li><a href="/admin/users">用户管理</a></li>
                <li><a href="/admin/knowledge">知识库</a></li>
                <li><a href="/admin/records" class="active">检测记录</a></li>
                <li><a href="/admin/models">模型管理</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <header class="topbar"><h1>检测记录</h1><div class="topbar-right"><a href="/admin/login" class="logout-btn">退出</a></div></header>
            <div class="content">
                <div class="card">
                    <h3>音频检测记录</h3>
                    <table class="data-table">
                        <thead>
                            <tr><th>ID</th><th>任务ID</th><th>文件名</th><th>结果</th><th>伪造概率</th><th>风险等级</th><th>状态</th><th>时间</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="rec : ${audioRecords}">
                                <td th:text="${rec.id}"></td>
                                <td th:text="${rec.taskId}" class="text-mono text-max-100"></td>
                                <td th:text="${rec.fileName}" class="text-max-150"></td>
                                <td><span class="badge" th:classappend="${rec.detectionResult == 'spoof'} ? 'badge-danger' : 'badge-ok'" th:text="${rec.detectionResult}"></span></td>
                                <td th:text="${rec.spoofProbability} ? ${#numbers.formatDecimal(rec.spoofProbability * 100, 1, 2)} + '%' : '-'"></td>
                                <td><span class="badge" th:classappend="${rec.riskLevel == 'high'} ? 'badge-danger' : ${rec.riskLevel == 'medium'} ? 'badge-warn' : 'badge-ok'" th:text="${rec.riskLevel}"></span></td>
                                <td th:text="${rec.status}"></td>
                                <td th:text="${rec.createdAt}"></td>
                            </tr>
                            <tr th:if="${audioRecords.isEmpty()}">
                                <td colspan="8" class="text-center text-muted">暂无检测记录</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
