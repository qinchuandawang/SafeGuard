<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SafeGuard 管理后台 - 模型管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header"><h2>SafeGuard</h2><span class="version">v2.0</span></div>
            <ul class="nav-list">
                <li><a href="/admin/dashboard">概览</a></li>
                <li><a href="/admin/users">用户管理</a></li>
                <li><a href="/admin/knowledge">知识库</a></li>
                <li><a href="/admin/records">检测记录</a></li>
                <li><a href="/admin/models" class="active">模型管理</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <header class="topbar"><h1>模型管理</h1><div class="topbar-right"><a href="/admin/login" class="logout-btn">退出</a></div></header>
            <div class="content">
                <div class="card">
                    <h3>当前活跃模型</h3>
                    <div th:if="${activeModel}" class="info-box">
                        <p><strong>名称：</strong>[[${activeModel.name}]]</p>
                        <p><strong>版本：</strong>[[${activeModel.modelVersion}]]</p>
                        <p><strong>类型：</strong>[[${activeModel.modelType}]]</p>
                        <p><strong>准确率：</strong>[[${activeModel.accuracy}]]</p>
                        <p><strong>EER：</strong>[[${activeModel.eer}]]</p>
                    </div>
                    <div th:if="${!activeModel}" class="info-box info-warn">暂无活跃模型</div>
                </div>

                <div class="card">
                    <h3>所有模型</h3>
                    <table class="data-table">
                        <thead>
                            <tr><th>ID</th><th>名称</th><th>版本</th><th>类型</th><th>准确率</th><th>EER</th><th>活跃</th><th>数据集</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${models}">
                                <td th:text="${m.id}"></td>
                                <td th:text="${m.name}"></td>
                                <td th:text="${m.modelVersion}"></td>
                                <td th:text="${m.modelType}"></td>
                                <td th:text="${m.accuracy}"></td>
                                <td th:text="${m.eer}"></td>
                                <td><span class="badge" th:classappend="${m.isActive} ? 'badge-ok' : 'badge-disabled'" th:text="${m.isActive} ? '是' : '否'"></span></td>
                                <td th:text="${m.trainingDataset}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
