server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3306/safeguard?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000
      pool-name: SafeGuardHikariCP
  sql:
    init:
      # 开发环境用 always 自动建表（schema.sql / init-data.sql 均幂等，可安全重复执行）
      # 生产环境由 application-prod.yml 的 ${SQL_INIT_MODE:never} 覆盖
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/init-data.sql
      continue-on-error: true

app:
  admin:
    # true: 仅允许系统没有管理员账号时开放公开注册；false: 完全关闭公开注册。
    allow-bootstrap-register: ${ADMIN_BOOTSTRAP_REGISTER:true}

mybatis-plus:
  type-aliases-package: com.sdu.safeguard.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Jackson: 非 ASCII 字符转义为 \uXXXX，避免微信小程序 wx.uploadFile
# 在 Windows 下按 GBK 解码 UTF-8 响应体导致中文乱码
# 注意：合并到上方 spring: 块，避免重复 spring: key 覆盖 datasource 等配置

# JWT 配置
jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-change-in-production}
  expiration-hours: 24

# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID:your-wechat-appid}
  secret: ${WECHAT_SECRET:your-wechat-secret}
  login-url: https://api.weixin.qq.com/sns/jscode2session

# 音频检测服务地址
audio:
  service:
    url: http://localhost:5000/audio/detect
  detection:
    api-url: http://localhost:5000/audio/detect
    health-url: http://localhost:5000/health

# 视频检测服务地址
video:
  service:
    url: http://localhost:5002/api/detect/video
    image-url: http://localhost:5002/api/detect/image
  preprocess:
    enabled: ${VIDEO_PREPROCESS_ENABLED:true}
    sample-interval-seconds: 1.0
    max-frames: 24
    face-padding-ratio: 0.12
    multipart-field: file

# 大模型配置（SophNet）
llm:
  api-key: ${LLM_API_KEY:}
  api-url: ${LLM_API_URL:https://api.sophnet.com/v1/chat/completions}
  model: ${LLM_MODEL:DeepSeek-V4-Flash}
  temperature: 0.7
  max-tokens: 2048
  enable-thinking: false

# SiliconFlow API 配置
siliconflow:
  api-key: ${SILICONFLOW_API_KEY:}
  embedding-url: https://api.siliconflow.cn/v1/embeddings
  rerank-url: https://api.siliconflow.cn/v1/rerank
  embedding-model: BAAI/bge-large-zh-v1.5
  rerank-model: BAAI/bge-reranker-v2-m3

# RAG 配置
rag:
  embedding-dimension: 1024
  qdrant-host: ${QDRANT_HOST:localhost}
  qdrant-port: ${QDRANT_PORT:6333}
  collection-name: anti_fraud_knowledge
  fixed-chunk-size: 256
  fixed-chunk-overlap: 32
  semantic-chunk-min-size: 100
  semantic-chunk-max-size: 512
  semantic-similarity-threshold: 0.75
  hnsw-top-k: 20
  rerank-top-k: 10
  final-top-k: 5
  keyword-boost-factor: 1.2
  dedup-threshold: 0.92
  allow-in-memory-fallback: true
  rules-path: config/rules.json

# 记忆系统配置
memory:
  short-term-max-size: 50
  long-term-max-size: 1000
  long-term-ttl-hours: 168
  long-term-importance-threshold: 0.6
  storage-path: ./data/memory
  memory-retrieval-top-k: 10
  memory-collection: user_memories
  memory-embedding-dim: 1024
