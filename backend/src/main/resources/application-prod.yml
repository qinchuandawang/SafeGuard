# SafeGuard 生产环境配置（Docker 容器部署）
# 覆盖 application.yml 中的 localhost 地址为容器名

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/safeguard?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    hikari:
      initialization-fail-timeout: 30000
      connection-timeout: 10000
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/init-data.sql
      continue-on-error: false

memory:
  short-term-context-size: ${MEMORY_SHORT_TERM_CONTEXT_SIZE:20}
  short-term-ttl-hours: ${MEMORY_SHORT_TERM_TTL_HOURS:24}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8085}
  http:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
  auth:
    demo-identity-enabled: ${DEMO_IDENTITY_ENABLED:false}
  admin:
    allow-bootstrap-register: ${ADMIN_BOOTSTRAP_REGISTER:false}

ai:
  orchestrator:
    base-url: ${ORCHESTRATOR_BASE_URL:http://safeguard-orchestrator:5003}
    multimodal-url: ${ORCHESTRATOR_MULTIMODAL_URL:http://safeguard-orchestrator:5003/v1/workflows/multimodal}

wechat:
  allow-test-login: ${WECHAT_ALLOW_TEST_LOGIN:false}

# 音频检测服务（容器内使用容器名）
audio:
  service:
    url: ${AUDIO_SERVICE_URL:http://safeguard-audio:5000/audio/detect}
  detection:
    api-url: http://safeguard-audio:5000/audio/detect
    health-url: http://safeguard-audio:5000/health

# 视频检测服务（容器内使用容器名）
video:
  service:
    url: ${VIDEO_SERVICE_URL:http://safeguard-video:5002/api/detect/video}
    image-url: http://safeguard-video:5002/api/detect/image

# RAG 配置（Qdrant 容器名）
rag:
  qdrant-host: ${QDRANT_HOST:qdrant}
  qdrant-port: ${QDRANT_PORT:6333}
  allow-in-memory-fallback: false

# 日志级别（生产环境关闭 SQL 日志）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Actuator health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
