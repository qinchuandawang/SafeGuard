# SafeGuard 生产环境配置（Docker 容器部署）
# 覆盖 application.yml 中的 localhost 地址为容器名

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/safeguard?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    hikari:
      initialization-fail-timeout: 30000
      connection-timeout: 10000
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/init-data.sql
      continue-on-error: true

# 微信小程序配置（从环境变量读取）
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

# 大模型配置（从环境变量读取）
llm:
  api-key: ${DEEPSEEK_API_KEY:}

# SiliconFlow API 配置
siliconflow:
  api-key: ${SILICONFLOW_API_KEY:}

# 音频检测服务（容器内使用容器名）
audio:
  service:
    url: http://safeguard-audio:5000/audio/detect
  detection:
    api-url: http://safeguard-audio:5000/audio/detect
    health-url: http://safeguard-audio:5000/health

# 视频检测服务（容器内使用容器名）
video:
  service:
    url: http://safeguard-video:5002/video
    image-url: http://safeguard-video:5002/video

# RAG 配置（Qdrant 容器名）
rag:
  qdrant-host: ${QDRANT_HOST:qdrant}
  qdrant-port: ${QDRANT_PORT:6333}

# 日志级别（生产环境关闭 SQL 日志）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
